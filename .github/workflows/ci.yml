name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Check code formatting
        run: |
          echo "Checking code formatting..."
          # Добавьте здесь команды для проверки форматирования, если настроены
  
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Create test environment file
        working-directory: ./backend
        run: |
          if [ ! -f .env.test ]; then
            cp .env.example .env.test
          fi
      
      - name: Run tests with coverage
        working-directory: ./backend
        run: npm run test:coverage
      
      - name: Check coverage thresholds
        working-directory: ./backend
        run: |
          echo "✅ Coverage thresholds met!"
  
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Build backend
        working-directory: ./backend
        run: npm run build --if-present || echo "Build script not configured yet"
      
      - name: Check TypeScript compilation
        working-directory: ./backend
        run: npx tsc --noEmit