name: Deploy to Yandex Cloud

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Serverless Container
        id: deploy-sls-container
        uses: yc-actions/yc-sls-container-deploy@v4
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          container-name: sinshell-app
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          revision-service-account-id: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          revision-cores: 1
          revision-memory: 256MB
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-image-url: cr.yandex.io/${{ secrets.YC_REGISTRY_ID }}/sinshell:${{ github.sha }}
          revision-execution-timeout: 30
          environment: |
            NODE_ENV=production
            PORT=5000
            HOST=0.0.0.0
            NEXT_PUBLIC_API_URL=https://${{ secrets.APP_DOMAIN }}
            NEXT_PUBLIC_APP_NAME=SinShell
            LOG_LEVEL=info

      - name: Get deployment info
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📦 Container: sinshell-app"
          echo "🌐 App URL: https://${{ secrets.APP_DOMAIN }}"
          echo "🔧 Image: cr.yandex.io/${{ secrets.YC_REGISTRY_ID }}/sinshell:${{ github.sha }}"

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to Yandex Cloud completed successfully!"
            echo "🌐 Your app is available at: https://${{ secrets.APP_DOMAIN }}"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
