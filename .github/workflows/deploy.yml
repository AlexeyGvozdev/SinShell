name: Deploy to Yandex Cloud

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
    # types: [closed]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        cd frontend && npm ci
        cd ../backend && npm ci
    
    - name: Run tests
      run: |
        cd frontend && npm test -- --coverage --watchAll=false
        cd ../backend && npm test -- --coverage --watchAll=false
    
    - name: Build frontend
      run: |
        cd frontend && npm run build
    
    - name: Build backend
      run: |
        cd backend && npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Yandex Cloud Registry
      run: |
        echo "${{ secrets.YC_IAM_TOKEN }}" | docker login cr.yandex.io --username iam --password-stdin
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          cr.yandex.io/${{ secrets.YC_REGISTRY_ID }}/sinshell:latest
          cr.yandex.io/${{ secrets.YC_REGISTRY_ID }}/sinshell:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Deploy to Yandex Cloud
      run: |
        # Установка Yandex CLI
        curl https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
        export PATH=$HOME/.yandex/cloud/bin:$PATH
        
        # Аутентификация
        yc config profile create ci-cd
        yc config set token "${{ secrets.YC_IAM_TOKEN }}"
        yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
        yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"
        
        # Обновление приложения
        yc serverless container update \
          --name sinshell-app \
          --image cr.yandex.io/${{ secrets.YC_REGISTRY_ID }}/sinshell:${{ github.sha }} \
          --port 80 \
          --memory 256M \
          --cores 1 \
          --execution-timeout 30s \
          --environment NODE_ENV=production \
          --environment PORT=5000 \
          --environment HOST=0.0.0.0 \
          --environment NEXT_PUBLIC_API_URL=https://${{ secrets.APP_DOMAIN }} \
          --environment NEXT_PUBLIC_APP_NAME=SinShell \
          --environment LOG_LEVEL=info \
          --min-instances 0 \
          --max-instances 5
    
    - name: Get deployment info
      run: |
        # Установка Yandex CLI
        curl https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
        export PATH=$HOME/.yandex/cloud/bin:$PATH
        
        # Аутентификация
        yc config profile create ci-cd
        yc config set token "${{ secrets.YC_IAM_TOKEN }}"
        yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
        yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"
        
        # Получение информации о приложении
        echo "🚀 Deployment completed successfully!"
        echo "📦 Image: cr.yandex.io/${{ secrets.YC_REGISTRY_ID }}/sinshell:${{ github.sha }}"
        echo "🌐 App URL: https://${{ secrets.APP_DOMAIN }}"
        
        # Проверка статуса
        yc serverless container get --name sinshell-app
    
    - name: Notify deployment
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to Yandex Cloud completed successfully!"
          echo "🌐 Your app is available at: https://${{ secrets.APP_DOMAIN }}"
        else
          echo "❌ Deployment failed!"
          exit 1
        fi